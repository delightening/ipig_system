# ============================================
# Production override: GHCR images（部署為人工執行，2026-09-02 起不再自動換版）
# ============================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# ⚠️ **不要加 `--no-build`**：print-pdf 沒有 GHCR 映像（商用字型不可隨 repo 散布，
#    CI 建不出來），必須在目標機器本機建。加了 `--no-build` 會因缺映像而失敗。
#    其餘四個服務有 `image:` 覆寫，會直接拉 GHCR 映像不重建。
#
# Required env vars in .env:
#   GHCR_OWNER  - GitHub username or org
#   IMAGE_TAG   - Image tag (default: latest)
#
# Prerequisites:
#   docker login ghcr.io -u <GHCR_OWNER> --password-stdin < token.txt
# ============================================

services:
  # Override api to use GHCR image
  api:
    image: ghcr.io/${GHCR_OWNER}/ipig-api:${IMAGE_TAG:-latest}
    # P0-S3: 生產環境使用 Docker Secrets 取代環境變數中的明文機密
    secrets:
      - jwt_ec_private_key
      - jwt_ec_public_key
      - db_url
      - smtp_password
    environment:
      JWT_EC_PRIVATE_KEY_FILE: /run/secrets/jwt_ec_private_key
      JWT_EC_PUBLIC_KEY_FILE: /run/secrets/jwt_ec_public_key
      DATABASE_URL_FILE: /run/secrets/db_url
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      # R24-3: Alertmanager webhook token（從 .env 注入；值需與 ./secrets/alertmanager_webhook_token.txt 一致）
      ALERTMANAGER_WEBHOOK_TOKEN: ${ALERTMANAGER_WEBHOOK_TOKEN:-}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    # R22-18: 加大 log rotation（安全事件 tracing log 需保留更長時間）
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # Override web to use GHCR image（Critical 3：生產綁定 localhost，對外由反向代理提供）
  web:
    image: ghcr.io/${GHCR_OWNER}/ipig-web:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Override outbox-worker to use GHCR image
  # base compose 對它是 `build:`，不覆寫的話 `--no-build` 會因缺映像而失敗
  outbox-worker:
    image: ghcr.io/${GHCR_OWNER}/ipig-outbox-worker:${IMAGE_TAG:-latest}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ⚠️ print-pdf **刻意沒有 image 覆寫**，它在目標機器本機建。
  # 原因：`services/print-pdf/Dockerfile:31` 需要 `services/print-pdf/fonts/`，
  # 而那些是商用專屬字型（標楷體 DFKai-SB／Times New Roman／Arial），
  # 依 `.gitignore:141` 禁止隨 repo 散布，CI 上建不出來。
  #
  # ⚠️ 因此本 overlay **不可搭配 `--no-build`**：
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
  # 四個有覆寫的服務會拉 GHCR 映像，print-pdf 在本機建。
  # 目標機器必須自備 `services/print-pdf/fonts/` 底下的字型檔。

  # Database resource limits
  db:
    # P0-S3: 使用 Docker Secrets 提供資料庫密碼
    secrets:
      - db_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # db-backup（High 5: Secret 提供密碼；High 7: 生產強制 GPG 加密）
  # ⚠️ image 覆寫這一行不能省——base compose 對它是 `build:`，
  # 缺了它 `--no-build` 一樣會失敗。
  # （原本此處另有 watchtower.enable=false，已隨 watchtower 服務一併移除。）
  db-backup:
    image: ghcr.io/${GHCR_OWNER}/ipig-db-backup:${IMAGE_TAG:-latest}
    secrets:
      - db_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      BACKUP_REQUIRE_ENCRYPTION: "true"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # =========================
  # R24-2: Loki + Promtail（生產環境集中式日誌收集）
  # =========================
  loki:
    image: grafana/loki:3.0.0
    container_name: ipig-loki
    # localhost-only：僅 Grafana 與 Promtail 於同網段存取
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    container_name: ipig-promtail
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    restart: unless-stopped

  # =========================
  # Watchtower：已於 2026-09-02 移除（使用者裁定）
  # =========================
  # 原本掛在這裡的 `watchtower` 服務會每 3600 秒輪詢 GHCR，自動拉新映像重啟
  # api / web / outbox-worker（三者的 `watchtower.enable=true` 亦一併移除）。
  #
  # **移除理由不是它壞掉，是自動換版與本專案的部署現實衝突：**
  # 部署後有必須由人執行的資料補救——`recalculate_all_po_receipt_status` 不在啟動
  # 路徑上（#39），#34 收緊設備報廢簽章權後既有「已簽章、仍待核准」的單也不會自動
  # 解開。watchtower 在無人值守時完成部署，那兩步不會有人做，使用者會在「code 已修好、
  # 資料仍是壞的」狀態上操作，且沒有可指認的部署時間點（GLP 環境需要）。
  #
  # 連帶移除的暴露面：`/var/run/docker.sock`（root-equivalent）、`127.0.0.1:8090`
  # 的 HTTP API（`WATCHTOWER_HTTP_API_UPDATE=true`）、兩個專用 secrets。
  # 停用之後這些沒有用途，留著只是攻擊面。
  #
  # 部署改為人工執行，程序見 `docs/runbooks/handover/PROMPT-vet-20260902.md`：
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
  #
  # ⚠️ `scripts/watchtower-entrypoint.sh` 與 `secrets/watchtower_*.txt` 未在本次一併
  # 刪除（前者現已無引用，後者屬 secrets 不在本 PR 範圍）。要恢復自動部署就是把本段
  # 還原並把三個服務的 label 加回 `true`。

# P0-S3: Docker Secrets for production
# 建立方式（先在 Host 執行一次）:
#   openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt > secrets/jwt_ec_private_key.pem
#   openssl ec -in secrets/jwt_ec_private_key.pem -pubout > secrets/jwt_ec_public_key.pem
volumes:
  loki_data:

secrets:
  jwt_ec_private_key:
    file: ./secrets/jwt_ec_private_key.pem
  jwt_ec_public_key:
    file: ./secrets/jwt_ec_public_key.pem
  db_url:
    file: ./secrets/db_url.txt
  db_password:
    file: ./secrets/db_password.txt
  smtp_password:
    file: ./secrets/smtp_password.txt
  # watchtower_api_token / watchtower_smtp_password 隨 watchtower 服務一併移除
  # （2026-09-02）。secrets 檔案本身留在各機器上，未在本 PR 處理。
