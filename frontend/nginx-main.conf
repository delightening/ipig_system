# 載入 Brotli 模組（georgjung/nginx-brotli 映像）
load_module modules/ngx_http_brotli_static_module.so;
load_module modules/ngx_http_brotli_filter_module.so;

pid /tmp/nginx/nginx.pid;

events {
    worker_connections 2048;
}

http {
    # 防止 ERR_CONNECTION_CLOSED：預設 75s 短於使用者換 tab 的常見閒置時間。
    # shouldPoll() 在 document.hidden 或 token 即將到期時停止所有輪詢；
    # 若閒置超過 keepalive_timeout，nginx 會關閉 H2 connection，
    # 返回 tab 時全部 polling query 同時打到已關閉的連線 → ERR_CONNECTION_CLOSED。
    keepalive_timeout 300s;

    # A6 資安/可用性修補：nginx 綁 127.0.0.1、唯一入口是 Cloudflare Tunnel(cloudflared)。
    # 還原真實 client IP，否則 $binary_remote_addr 是 cloudflared/docker 來源位址（對所有
    # 外部使用者相同），使下方 per-IP 限流塌縮成全站共用單桶。信任來源限 loopback + docker
    # 私網段——外部無法直達 127.0.0.1-bound nginx，故無 CF-Connecting-IP 偽造面。
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # 請求速率限制（P1-R4-9：每 IP 每秒 10 個請求，burst 20）
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # JSON 結構化 access log
    log_format json_combined escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    include       /etc/nginx/conf.d/*.conf;
}
