server {
    listen 8080 http2;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # R55-2 (2026-05-16)：docker embedded DNS resolver + 變數化 proxy_pass。
    # 沒有這個，proxy_pass http://api:8000 nginx 只在啟動時 resolve 一次 IP；
    # api container recreate（拿到新 IP）後 nginx 還用舊 IP → 全 API 502，
    # 必須 docker restart web 才會 reset。改用變數 → nginx 走 resolver 每次重新解析。
    # 127.0.0.11 是 docker 內建 DNS，valid=10s 控 cache TTL，ipv6=off 避免 AAAA 查詢卡頓。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 結構化 access log（P1-R4-9）
    access_log /var/log/nginx/access.log json_combined;

    # 隱藏 Nginx 版本號（SEC-16）
    server_tokens off;

    # R31-7: per-request CSP nonce
    # 用 nginx 內建 $request_id（每 request 32 hex chars，足夠的熵）作 nonce 來源。
    # security-headers.conf 內 Content-Security-Policy-Report-Only header 引用此變數；
    # 下方 sub_filter 把 Vite plugin 注入的 __CSP_NONCE__ placeholder 替換為實際 nonce。
    set $cspNonce $request_id;

    # 將 HTML response 內的 __CSP_NONCE__ placeholder（由 Vite cspNoncePlugin 注入到
    # <script> 與 <link rel="modulepreload">）替換為 per-request 的 $cspNonce。
    # sub_filter_once off：替換所有 occurrence，而非僅第一個。
    # sub_filter_types 預設只處理 text/html，已足夠（JS/CSS 不該含 placeholder）。
    sub_filter '__CSP_NONCE__' $cspNonce;
    sub_filter_once off;

    # 安全標頭（SEC-07 / SEC-27 / SEC-37）：用 snippet 避免 nginx add_header 繼承失效
    # 每個 override 了 add_header 的 location 都必須重複 include，否則該 location
    # 的 response 會失去所有 security header（nginx 核心行為）。
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip compression（強化壓縮策略）
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/font-woff2 image/svg+xml;

    # Brotli compression（P1-13）
    # 注意：標準 nginx:alpine 可能需要編譯模組，此處先配置以備支援
    brotli on;
    brotli_comp_level 6;
    brotli_static on;
    brotli_types text/plain text/css application/json application/javascript
                 text/xml application/xml application/xml+rss text/javascript
                 application/font-woff2 image/svg+xml;

    # API proxy（含速率限制）
    location /api {
        include /etc/nginx/snippets/security-headers.conf;
        # burst=50：容納 Dashboard 載入時單一使用者的並發 fan-out（~40 支 API），
        # 避免正常操作踩到限流。rate 仍 10r/s（見 nginx-main.conf api_limit zone）。
        # limit_req_status 429：被限流時回 429（而非預設 503），語意正確，
        # 前端可辨識為「請稍候重試」而非伺服器故障。
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;
        # R55-2：變數化 proxy_pass，強迫 nginx 走 resolver per-request 解析。
        # 必須 $request_uri 接後面，否則 variable form 不會自動帶 URI。
        set $api_upstream "${API_BACKEND_URL}";
        proxy_pass $api_upstream$request_uri;
        client_max_body_size 30m;  # SEC-36: 請求大小限制（配合最大附件 30MB）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 保留 Authorization header 轉發，向後相容 Bearer token（Python 測試/外部 API 用戶端）
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_cache_bypass $http_upgrade;

        # 加大 proxy buffer 以容納包含 JWT 的 Set-Cookie headers（修復 502 Bad Gateway）
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 16k;

        # PDF 匯出（vet_patrol / surgery / blood_test 等）走 Word COM daemon，
        # cold-start 30-60s 屬正常範圍。預設 60s 會 504。
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # SEC-35: 禁止直接存取上傳目錄，所有檔案下載必須透過 /api/attachments/:id API
    location /uploads {
        include /etc/nginx/snippets/security-headers.conf;
        deny all;
        return 403;
    }

    # AI agent readiness：明確指定 MIME，避免 SPA fallback 把它們當 HTML 回傳
    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/xml;
        add_header Content-Type "application/xml; charset=utf-8" always;
        try_files $uri =404;
    }

    # F2（pentest 2026-07-05）：llms.txt 為 AI 可讀 API 說明（端點/用法），屬匿名攻擊面 → 404
    #（零匿名探索原則；具名 agent 走認證後的 REST/MCP，不靠此檔）。
    location = /llms.txt {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }

    location = /.well-known/security.txt {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # F2（pentest 2026-07-05）：AI 探索檔（agents/mcp/webmcp.json）含端點與工具 input schema，
    # 屬匿名可枚舉的攻擊面。使用者決策：所有 AI 都要具名、零匿名自由探索 → 一律 404。
    # 具名 agent 由 admin 發 mcp_ key + /api/v1/mcp 端點（out-of-band），不需匿名探索。
    # 例外：/.well-known/security.txt 有自己的 exact-match location（RFC 9116 標準聯絡資訊，非攻擊面），仍公開。
    location ^~ /.well-known/ {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }

    # /openapi.json 代理至後端 utoipa OpenAPI spec
    # F2（pentest 2026-07-05）：後端已對此路由加認證（具名身分才可取完整 schema，擋匿名 recon）。
    # 必須轉發 Authorization（Bearer）給後端做 gate；cookie 預設即轉發。回應屬使用者相關，改 no-store。
    location = /openapi.json {
        include /etc/nginx/snippets/security-headers.conf;
        # R55-2：同 /api，變數化避免靜態 IP cache
        set $api_openapi "${API_BACKEND_URL}";
        proxy_pass $api_openapi/api-docs/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Cache-Control "no-store" always;
    }

    # SPA fallback
    # F2（pentest 2026-07-05）：原對 / 的 Accept: text/markdown 內容協商轉 llms.txt 已移除
    #（llms.txt 為零匿名探索一併收斂）。
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        # R31-7 follow-up：per-request CSP nonce 必須走未壓縮 + 不快取的 HTML
        # 才能讓 sub_filter 替換 __CSP_NONCE__；否則 Content-Encoding 已設會跳過 sub_filter，
        # 或 cached HTML 內 nonce 與後續 request CSP header 不對應 → 整頁 script 被擋
        brotli_static off;
        gzip_static off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Vary "Accept" always;
        # R31-7 follow-up（同上）：HTML SPA fallback 路徑不可快取 / 不可走預壓縮
        brotli_static off;
        gzip_static off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets（保留安全標頭）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}
