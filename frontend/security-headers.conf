# 共用安全標頭 snippet
# 由 nginx.conf 透過 `include /etc/nginx/snippets/security-headers.conf;` 載入
# 解決 nginx add_header 繼承問題：子 location 只要有自己的 add_header，
# 就會覆寫 server 層的所有 add_header。改為在每個需要 add_header 的
# location 都 include 本檔，確保安全標頭始終被送出。

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

# R31-10（2026-05-15）：CSP enforce cutover — 從「舊 enforce + 新 Report-Only 並存」
# 升級為「單一嚴格 enforce header」。歷史軌跡：
#   - R31-1 (2026-04-29): Report-Only baseline 觀察開始
#   - R31-7/8 (2026-05-03): nginx sub_filter nonce + Vite plugin 注入 placeholder
#   - R31-11 (2026-05-07): Reporting-Endpoints + report-to (CSP3)
#   - R31-9 (2026-05-13): cutover SOP `docs/runbooks/csp-enforce-cutover.md`
#   - R31-10 (2026-05-15): cutover 落地（本 PR）— 12 天 RO 觀察期、Playwright 3 engines 確認
#
# R31-C (2026-05-15) 同步決策：**移除 Cloudflare Insights 白名單**
#   - CF Insights beacon 內部使用 eval() → 收緊 'unsafe-eval' 的最後一個阻礙
#   - solo + prod-on-laptop 場景下 telemetry 已由 self-hosted Prometheus/Grafana/Loki 提供
#   - 移除後 script-src 無 'unsafe-eval'、無第三方 CDN、僅靠 nonce + strict-dynamic
#
# 'wasm-unsafe-eval' 保留：允許 WebAssembly 模組執行（CSP3 窄化指令）
# #410（code-review）：加 base-uri 'self'（限制 <base> 注入劫持相對 URL）與
# form-action 'self'（限制表單外送目標）。default-src 不涵蓋此兩指令，須顯式宣告。
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; script-src 'self' 'nonce-$cspNonce' 'strict-dynamic' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; report-uri /api/v1/csp-report; report-to csp-endpoint" always;

# R31-11: 加 Reporting-Endpoints header（CSP3 + Reporting API 標準）— Chrome / Edge
# 96+ 已 deprecate 舊版 report-uri，新版改 report-to + Reporting-Endpoints。雙路徑
# 並存（dual-report）：legacy 走 report-uri，新版走 report-to → handler 用
# Content-Type 分流（application/csp-report vs application/reports+json）。
# 新版 payload 內 body.disposition 自帶 enforce/report 區分。
#
# 用 $http_host（含 port）而非 $host（去 port）— 後者在非標準 port 環境（dev:8080
# 等）會解析成 default 80/443，瀏覽器送 report 到不存在的 port 失敗（Gemini PR #345
# review）。$http_host 由瀏覽器 Host header 決定，與當下 page origin 一致。
# F3（pentest 2026-07-05）：scheme 硬編 https，不用 $scheme。prod 經 Cloudflare Tunnel
# 終結 TLS、到 origin(nginx) 這段是 http → $scheme 會解析成 http，導致 CSP 違規報告走明文
# 可被 MITM 竊聽/竄改。站台對外恆為 https（HSTS preload），故 report 端點硬編 https。
add_header Reporting-Endpoints 'csp-endpoint="https://$http_host/api/v1/csp-report"' always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# style-src 仍保留 'unsafe-inline'（R31-13 已接受風險）：238 處 React inline style
# 為已接受風險，CSS-in-JS 遷移工程量過大；改用 SRI / DOMPurify 從注入路徑端防護。
