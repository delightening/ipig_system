name: 功能請求 (Feature Request)
description: 建議新功能或改善現有功能
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感謝您的建議！請說明業務需求與預期功能，我們會依優先級評估。

  - type: dropdown
    id: module
    attributes:
      label: 目標模組
      options:
        - AUP 計畫書管理
        - 動物管理
        - 實驗執行
        - HR 人事管理
        - 進銷存 (ERP)
        - 系統管理
        - 報表 / PDF 匯出
        - 通知系統
        - 基礎設施 / DevOps
        - 跨模組 / 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 問題或需求背景
      placeholder: |
        您目前遇到什麼問題？或是什麼業務需求驅動此功能？
        例如：「每次要匯出動物清單都需要手動篩選，希望能儲存篩選條件」
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建議解決方案
      placeholder: 您希望看到的功能是什麼？盡量描述使用情境而非技術實作。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考慮的替代方案
      placeholder: 目前如何繞過此限制？有無其他方式可達成相同目的？

  - type: dropdown
    id: priority
    attributes:
      label: 建議優先級
      description: 協助我們排程，最終優先級由維護團隊決定
      options:
        - "P1 — 上線前必要（阻礙業務運作）"
        - "P2 — 中優先（月內期望）"
        - "P3 — 低優先（季內期望）"
        - "P4 — 中期品質提升"
        - "P5 — 長期演進（有空再做）"
    validations:
      required: true

  - type: checkboxes
    id: compliance
    attributes:
      label: 合規考量
      options:
        - label: 此功能涉及 GLP / 21 CFR Part 11 要求
        - label: 此功能需要寫入稽核記錄 (Audit Trail)
        - label: 此功能需要電子簽章確認
        - label: 此功能會接觸個資或敏感實驗資料
