name: "Setup Node.js + pnpm + frontend deps"
description: >
  Enable pnpm, install Node 24, restore pnpm cache, run `pnpm install --frozen-lockfile`.
  Composite action to DRY the boilerplate that appears in 4 frontend jobs.

inputs:
  install:
    description: "Run pnpm install (default true). Set to 'false' if job only needs node binary."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: 啟用 pnpm
      # pnpm/action-setup pinned to specific SHA per supply-chain hardening (R52)
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      with:
        package_json_file: frontend/package.json

    - name: 設定 Node.js
      # actions/setup-node pinned to specific SHA per supply-chain hardening (CSO-r3 #8)
      # 2026-09-02：與 ci.yml 的獨立 setup-node 一起升到 v7.0.0。#70 只升了 ci.yml
      # 那一處，因為本檔在 .github/actions/ 子目錄、不在當時 dependabot.yml 的
      # github-actions 涵蓋範圍內（見該檔同日補的 directories 說明）——同一個 action
      # 在同一個 repo 分成 v7 / v4 兩個版本，是那個缺口造成的，不是刻意的差異。
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24"
        cache: "pnpm"
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: 安裝依賴
      if: inputs.install == 'true'
      shell: bash
      working-directory: ./frontend
      run: pnpm install --frozen-lockfile
