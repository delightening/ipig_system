name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {} # 允許手動觸發部署

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # =========================
  # Only deploy if CI passed
  # =========================
  gate:
    name: "Gate: verify CI passed"
    runs-on: ubuntu-latest
    # A4 資安修補：workflow_run 需同時是「push 事件 + head_branch=main」才放行，堵掉
    # fork PR 把來源分支命名為 main 來偽造 branches 過濾、讓 CD 建置攻擊者程式碼（含
    # 任意 Dockerfile RUN + packages:write token）的供應鏈 RCE 風險。branches:[main]
    # 過濾對 PR 觸發比對的是可偽造的來源分支名，故不足恃。
    # workflow_dispatch（需 repo 寫入權才能手動觸發）維持可用。
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    outputs:
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - run: echo "CI passed for $SHA"
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}

  # =========================
  # Build and push all service images
  # =========================
  # 五個服務的建置步驟完全同構，差別只在 context / dockerfile / 映像名，故收斂成 matrix。
  # 新增服務時只要在 include 加一列，不必再複製一整個 job。
  #
  # `docker-compose.yml` 對 api / outbox-worker / web / print-pdf / db-backup
  # 五者都是 `build:`。本 matrix 建其中**四個**，print-pdf 不建。
  #
  # ⚠️ **print-pdf 不能在 CI 建，這是授權決定不是疏漏。**
  # `services/print-pdf/Dockerfile:31` 是 `COPY fonts ./fonts`，而
  # `services/print-pdf/fonts/`（標楷體 DFKai-SB／Times New Roman／Arial）
  # 被 `.gitignore:141` 排除——那些是商用專屬字型，**禁止隨 repo 散布**，
  # build 主機必須自備。GitHub runner 上沒有、也不該有這些字型，
  # 2026-08-22 實測失敗訊息即為 `failed to calculate checksum of ref ...: "/fonts": not found`。
  #
  # 因此目標機器**不要用 `--no-build`**：
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
  # 這樣四個有 `image:` 覆寫的服務會用 GHCR 映像，print-pdf 在本機建
  # （前提是該機器的 `services/print-pdf/fonts/` 已自備字型）。
  build:
    name: "Build & Push: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: read
      packages: write
    strategy:
      # 一個服務失敗不該中斷其他四個——否則要重跑整批才知道還有沒有別的錯。
      fail-fast: false
      matrix:
        include:
          - name: API
            image: ipig-api
            context: ./backend
            dockerfile: ./backend/Dockerfile
            version_args: true
          - name: Web
            image: ipig-web
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - name: Outbox Worker
            image: ipig-outbox-worker
            context: ./backend
            dockerfile: ./backend/Dockerfile.outbox-worker
            version_args: true
          # ⚠️ print-pdf 刻意不在此清單內，見下方註解。
          - name: DB Backup
            image: ipig-db-backup
            context: ./scripts/backup
            dockerfile: ./scripts/backup/Dockerfile.backup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # scope 依映像分開：五個 job 若共用預設 scope 會互相驅逐彼此的 cache，
          # 服務越多越嚴重。加了 scope 之後首次建置是冷的，之後各自命中自己的。
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          platforms: linux/amd64
          # R30-22 follow-up：注入 build-time 版本資訊給 handlers/version.rs。
          # 只有 backend/Dockerfile 與 Dockerfile.outbox-worker 宣告了這兩個 ARG，
          # 傳給其他三個會噴 "build-args were not consumed" 警告，故以 version_args 控制。
          # 未設 version_args 的 matrix 項目在此展開成空行，build-push-action 會忽略空行。
          build-args: |
            ${{ matrix.version_args && format('GIT_SHA={0}', github.sha) || '' }}
            ${{ matrix.version_args && format('BUILD_TIME={0}', steps.meta.outputs.created || github.event.head_commit.timestamp) || '' }}

  # =========================
  # Post-deploy summary
  # =========================
  summary:
    name: "Summary"
    runs-on: ubuntu-latest
    needs: [gate, build]
    if: always()
    steps:
      - name: Deployment success
        if: ${{ needs.build.result == 'success' }}
        run: |
          {
            echo "## Deployment Summary"
            echo ""
            echo "Images pushed to GHCR. Watchtower will auto-deploy."
            echo ""
            echo "| Image | Tag |"
            echo "|-------|-----|"
            for img in ipig-api ipig-web ipig-outbox-worker ipig-db-backup; do
              echo "| \`${IMAGE_PREFIX}/${img}\` | \`${SHA}\`, \`latest\` |"
            done
            echo ""
            echo "> print-pdf 不在此清單——商用字型不可隨 repo 散布，須在目標機器本機建。"
            echo "> 部署指令**不要**加 \`--no-build\`。"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          SHA: ${{ needs.gate.outputs.sha || github.sha }}

      - name: Deployment failed
        if: ${{ needs.build.result != 'success' }}
        run: |
          echo "::error::Image build/push failed. Deployment will NOT proceed."
          {
            echo "## Deployment FAILED"
            echo ""
            echo "build matrix result: ${BUILD_RESULT}"
            echo ""
            echo "逐個服務的結果見上方 job 清單——matrix 設了 fail-fast: false，"
            echo "失敗的服務不只一個時全部都會跑完並各自回報。"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        env:
          BUILD_RESULT: ${{ needs.build.result }}
