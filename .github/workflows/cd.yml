name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {} # 允許手動觸發部署

# =========================
# CD 全域序列化（2026-09-02 補）
#
# 群組**不帶 ref**，因為這裡要保護的資源是 GHCR 上的 `latest` tag，那是全域唯一的，
# 不是 per-branch。兩個 CD run 同時 build & push 同一組映像時會互相覆寫。
#
# `cancel-in-progress: false` 是刻意的：CD 正在做的是 push 映像到 registry，
# 中途砍掉會留下「四個映像推了兩個」的半套狀態，比排隊等更糟。這裡要的是排隊不是取代。
#
# ⚠️ 光靠序列化**不足以**修好 `latest` 指向錯誤——排隊順序是 CI 完成順序，
# 不是 commit 順序，舊 commit 仍可能最後才推。真正的修法是下面 gate 的
# `is_main_head` 判斷，本區塊只是避免同時推。
# =========================
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # =========================
  # Only deploy if CI passed
  # =========================
  gate:
    name: "Gate: verify CI passed"
    runs-on: ubuntu-latest
    # A4 資安修補：workflow_run 需同時是「push 事件 + head_branch=main」才放行，堵掉
    # fork PR 把來源分支命名為 main 來偽造 branches 過濾、讓 CD 建置攻擊者程式碼（含
    # 任意 Dockerfile RUN + packages:write token）的供應鏈 RCE 風險。branches:[main]
    # 過濾對 PR 觸發比對的是可偽造的來源分支名，故不足恃。
    # workflow_dispatch（需 repo 寫入權才能手動觸發）維持可用。
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    permissions:
      contents: read # 只讀 main 目前的 HEAD，不需要其他權限
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      is_main_head: ${{ steps.resolve.outputs.is_main_head }}
    steps:
      # 除了原本的「CI 過了沒」，這裡多解一件事：**這次要建的 commit 還是不是 main 的 HEAD**。
      #
      # 起因（2026-09-02 實測）：本 workflow 由 `workflow_run` 觸發，每一次 main 上的
      # CI 完成都會觸發一輪，而下方 build 是用 `ref: needs.gate.outputs.sha` checkout
      # 「觸發它的那次 CI 的 commit」。連續合併多支 PR 時就會有多輪 CD 同時在建**不同的
      # commit**，卻全都推同一個 `latest`——當日抓到兩輪分別在建 e66ca1c(#63) 與
      # 3229b2d(#64)。`latest` 最後指向誰取決於誰先跑完，與哪個 commit 比較新無關，
      # 而部署預設拉的正是 `latest`（`docker-compose.prod.yml` 的 `${IMAGE_TAG:-latest}`），
      # 等於部署可能拿到一個舊 build。
      #
      # ⚠️ 2026-09-03 訂正（PR #58 移除 watchtower 之後）：本段原本寫的危害是
      # 「watchtower 拉 latest → prod 被**自動**換到舊 build」。watchtower 已移除、
      # 部署改為人工執行，那個自動換版的路徑不存在了——**但本 job 的判斷仍然必要**：
      # 危害只是從「自動換錯版」變成「人工部署時拉到錯的 latest」，機制照留。
      # （最穩的做法仍是部署時把 IMAGE_TAG pin 成短 sha，不依賴 latest。）
      #
      # 判斷放在 gate、不放在 build：build 是 4 個 matrix job，放在那裡要各查一次 API，
      # 而且四個 job 可能查到不同的答案（main 在中間被推了新 commit），
      # 反而製造「有些映像貼了 latest、有些沒貼」的不一致。gate 只跑一次，四個 job 共用同一個結論。
      - name: 解析要建的 commit，並判斷它是否為 main 目前的 HEAD
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          # workflow_run 走 head_sha；workflow_dispatch 沒有那個欄位，退回 GITHUB_SHA
          # （＝手動觸發時所選 ref 的 HEAD）。原本此處為空字串，會讓下方 checkout
          # 退化成「預設分支」而不是明確的 commit。
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha="${EVENT_SHA:-$GITHUB_SHA}"
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$sha" = "$head" ]; then
            echo "is_main_head=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main_head=false" >> "$GITHUB_OUTPUT"
          fi

          echo "CI passed for $sha"
          echo "main 目前 HEAD  = $head"
          if [ "$sha" = "$head" ]; then
            echo "→ 這是 main HEAD，本輪會推 latest"
          else
            echo "::warning::$sha 已非 main HEAD（現為 $head），本輪只推 sha tag、不動 latest"
          fi

  # =========================
  # Build and push all service images
  # =========================
  # 五個服務的建置步驟完全同構，差別只在 context / dockerfile / 映像名，故收斂成 matrix。
  # 新增服務時只要在 include 加一列，不必再複製一整個 job。
  #
  # `docker-compose.yml` 對 api / outbox-worker / web / print-pdf / db-backup
  # 五者都是 `build:`。本 matrix 建其中**四個**，print-pdf 不建。
  #
  # ⚠️ **print-pdf 不能在 CI 建，這是授權決定不是疏漏。**
  # `services/print-pdf/Dockerfile:31` 是 `COPY fonts ./fonts`，而
  # `services/print-pdf/fonts/`（標楷體 DFKai-SB／Times New Roman／Arial）
  # 被 `.gitignore:141` 排除——那些是商用專屬字型，**禁止隨 repo 散布**，
  # build 主機必須自備。GitHub runner 上沒有、也不該有這些字型，
  # 2026-08-22 實測失敗訊息即為 `failed to calculate checksum of ref ...: "/fonts": not found`。
  #
  # 因此目標機器**不要用 `--no-build`**：
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
  # 這樣四個有 `image:` 覆寫的服務會用 GHCR 映像，print-pdf 在本機建
  # （前提是該機器的 `services/print-pdf/fonts/` 已自備字型）。
  build:
    name: "Build & Push: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: read
      packages: write
    strategy:
      # 一個服務失敗不該中斷其他四個——否則要重跑整批才知道還有沒有別的錯。
      fail-fast: false
      matrix:
        include:
          - name: API
            image: ipig-api
            context: ./backend
            dockerfile: ./backend/Dockerfile
            version_args: true
          - name: Web
            image: ipig-web
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - name: Outbox Worker
            image: ipig-outbox-worker
            context: ./backend
            dockerfile: ./backend/Dockerfile.outbox-worker
            version_args: true
          # ⚠️ print-pdf 刻意不在此清單內，見下方註解。
          - name: DB Backup
            image: ipig-db-backup
            context: ./scripts/backup
            dockerfile: ./scripts/backup/Dockerfile.backup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          # ⚠️ `latest` 只在這次建的 commit 仍是 main HEAD 時才貼（判斷見 gate 的
          # resolve step）。舊 commit 的 CD 照樣推它自己的 sha tag——那有保留價值、
          # 也不會影響任何人——但不得覆寫 latest，否則**任何拉 `latest` 的部署都會
          # 拿到舊 build**。（2026-09-03 訂正：原文寫的是「watchtower 會把 prod 換到
          # 舊 build」，watchtower 已於 PR #58 移除，改述為與部署方式無關的說法。）
          #
          # `enable` 只接受求值為 `true` / `false` 的字串，其他值會直接報
          # `Invalid enable attribute value`。這裡的比較式必為兩者之一；
          # 萬一 gate 的 output 是空的，結果是 `false`＝不貼 latest，方向是安全的那邊。
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ needs.gate.outputs.is_main_head == 'true' }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # scope 依映像分開：五個 job 若共用預設 scope 會互相驅逐彼此的 cache，
          # 服務越多越嚴重。加了 scope 之後首次建置是冷的，之後各自命中自己的。
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          platforms: linux/amd64
          # R30-22 follow-up：注入 build-time 版本資訊給 handlers/version.rs。
          # 只有 backend/Dockerfile 與 Dockerfile.outbox-worker 宣告了這兩個 ARG，
          # 傳給其他三個會噴 "build-args were not consumed" 警告，故以 version_args 控制。
          # 未設 version_args 的 matrix 項目在此展開成空行，build-push-action 會忽略空行。
          #
          # ⚠️ 2026-09-02 訂正：`GIT_SHA` 原本填 `github.sha`，但本 workflow 由
          # `workflow_run` 觸發時，`github.sha` 是**預設分支的 HEAD**，而上面的 checkout
          # 用的是 `needs.gate.outputs.sha`（觸發它的那次 CI 的 commit）。兩者在連續合併
          # 時不同值——映像的內容是 A、`/version` 回報的卻是 B。改為與 checkout 同一個來源。
          build-args: |
            ${{ matrix.version_args && format('GIT_SHA={0}', needs.gate.outputs.sha) || '' }}
            ${{ matrix.version_args && format('BUILD_TIME={0}', steps.meta.outputs.created || github.event.head_commit.timestamp) || '' }}

  # =========================
  # Post-deploy summary
  # =========================
  summary:
    name: "Summary"
    runs-on: ubuntu-latest
    needs: [gate, build]
    # gate 沒放行＝**預期中的不部署**，整個 run 應該顯示 skipped 而不是 failure。
    #
    # 舊寫法是 `if: always()`，於是 gate 被跳過時這個 job 照樣跑，而下面的
    # 「Deployment failed」判斷是 `needs.build.result != 'success'`——build 因為
    # `needs: gate` 而一併 skipped，`'skipped' != 'success'` 成立，就 `exit 1`。
    # 結果是把「gate 判定不該部署」誤報成「build/push 失敗」。
    #
    # gate 的 if 條件（見上方 A4 資安修補）在三種情況下不成立，三者都不是失敗：
    #   1. CI conclusion 非 success —— 含被 `cancel-in-progress` 取消的中間 commit
    #   2. CI 不是 push 觸發
    #   3. CI 的 head_branch 不是 main
    # 第 1 種是常態：`ci.yml` 對 main 設了 `cancel-in-progress: true`，所以**每次連續
    # 合併都必然產生一筆假紅**。2026-09-02 實測，當天 main 上就有三筆同形狀的假紅
    # （其中一筆是合併 #73 時，前一顆 commit 76480fed 的 CI 被取消所致）。
    #
    # 假紅的代價不在那一筆，而在於它讓人養成忽略 CD 紅燈的習慣——真的壞掉時
    # 同樣不會有人去看。
    #
    # ⚠️ **只排除 gate `skipped`，不要連 `failure` 一起排除。** gate 自己執行失敗
    # （例如 resolve step 的 `gh api` 掛掉）時 result 是 `failure`，那要繼續走下面的
    # 失敗路徑紅掉。把它一併排除會製造一個真正的誤放行。
    if: ${{ always() && needs.gate.result != 'skipped' }}
    steps:
      - name: Deployment success
        if: ${{ needs.build.result == 'success' }}
        run: |
          {
            echo "## Deployment Summary"
            echo ""
            if [ "$IS_MAIN_HEAD" = "true" ]; then
              echo "Images pushed to GHCR，含 \`latest\`。**部署為人工執行**——"
              echo "見 \`scripts/deploy/setup-server.sh\` 與 \`rollback.sh\`（皆以 IMAGE_TAG 指定版本）。"
              tags="\`${SHA}\`, \`latest\`"
            else
              echo "⚠️ 本輪建的是 \`${SHA}\`，**已不是 main 的 HEAD**，故只推 sha tag、"
              echo "**沒有動 \`latest\`**——既有部署不受這一輪影響。"
              echo "要部署最新版，等 main HEAD 那一輪 CD 跑完，再人工執行部署。"
              tags="\`${SHA}\`（不含 \`latest\`）"
            fi
            echo ""
            echo "| Image | Tag |"
            echo "|-------|-----|"
            for img in ipig-api ipig-web ipig-outbox-worker ipig-db-backup; do
              echo "| \`${IMAGE_PREFIX}/${img}\` | ${tags} |"
            done
            echo ""
            echo "> print-pdf 不在此清單——商用字型不可隨 repo 散布，須在目標機器本機建。"
            echo "> 部署指令**不要**加 \`--no-build\`。"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          SHA: ${{ needs.gate.outputs.sha || github.sha }}
          IS_MAIN_HEAD: ${{ needs.gate.outputs.is_main_head }}

      - name: Deployment failed
        if: ${{ needs.build.result != 'success' }}
        run: |
          echo "::error::Image build/push failed. Deployment will NOT proceed."
          {
            echo "## Deployment FAILED"
            echo ""
            echo "build matrix result: ${BUILD_RESULT}"
            echo ""
            echo "逐個服務的結果見上方 job 清單——matrix 設了 fail-fast: false，"
            echo "失敗的服務不只一個時全部都會跑完並各自回報。"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        env:
          BUILD_RESULT: ${{ needs.build.result }}
