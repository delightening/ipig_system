name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {} # 允許手動觸發部署

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/ipig-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/ipig-web

jobs:
  # =========================
  # Only deploy if CI passed
  # =========================
  gate:
    name: "Gate: verify CI passed"
    runs-on: ubuntu-latest
    # A4 資安修補：workflow_run 需同時是「push 事件 + head_branch=main」才放行，堵掉
    # fork PR 把來源分支命名為 main 來偽造 branches 過濾、讓 CD 建置攻擊者程式碼（含
    # 任意 Dockerfile RUN + packages:write token）的供應鏈 RCE 風險。branches:[main]
    # 過濾對 PR 觸發比對的是可偽造的來源分支名，故不足恃。
    # workflow_dispatch（需 repo 寫入權才能手動觸發）維持可用。
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    outputs:
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - run: echo "CI passed for $SHA"
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}

  # =========================
  # Build and push API image
  # =========================
  build-api:
    name: "Build & Push: API"
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          # R30-22 follow-up：注入 build-time 版本資訊給 handlers/version.rs
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.created || github.event.head_commit.timestamp }}

  # =========================
  # Build and push Web image
  # =========================
  build-web:
    name: "Build & Push: Web"
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # =========================
  # Post-deploy summary
  # =========================
  summary:
    name: "Summary"
    runs-on: ubuntu-latest
    needs: [gate, build-api, build-web]
    if: always()
    steps:
      - name: Deployment success
        if: ${{ needs.build-api.result == 'success' && needs.build-web.result == 'success' }}
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Images pushed to GHCR. Watchtower will auto-deploy." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ env.API_IMAGE }}\` | \`${{ needs.gate.outputs.sha }}\`, \`latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ env.WEB_IMAGE }}\` | \`${{ needs.gate.outputs.sha }}\`, \`latest\` |" >> $GITHUB_STEP_SUMMARY

      - name: Deployment failed
        if: ${{ needs.build-api.result == 'failure' || needs.build-web.result == 'failure' }}
        run: |
          echo "::error::Image build/push failed. Deployment will NOT proceed."
          echo "## Deployment FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "API build: ${{ needs.build-api.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Web build: ${{ needs.build-web.result }}" >> $GITHUB_STEP_SUMMARY
          exit 1
